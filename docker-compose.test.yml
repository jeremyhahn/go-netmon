services:
  # Prometheus for receiving metrics
  prometheus:
    build:
      context: .
      dockerfile: test/integration/Dockerfile.prometheus
    # Published on an ephemeral host port, not a fixed one: the tests reach
    # prometheus as "prometheus:9090" over test-network, so a fixed host port
    # serves only local poking while making two concurrent stacks collide on
    # the bind. Find it with: docker compose -p <project> port prometheus 9090
    ports:
      - "9090"
    volumes:
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-remote-write-receiver'
      - '--web.enable-lifecycle'
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mock SNMP agent for testing
  snmp-simulator:
    build:
      context: .
      dockerfile: test/integration/Dockerfile.snmpsim
    # Ephemeral for the same reason as prometheus; the tests use
    # SNMP_HOST=snmp-simulator on test-network.
    ports:
      - "161/udp"
    environment:
      - SNMPSIM_AGENT_UDPV4_ENDPOINT=0.0.0.0:161
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "test", "-f", "/usr/local/snmpsim/data/public.snmprec"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 5s

  # Integration test runner
  # A Docker daemon of its own, for the tests that drive one.
  #
  # netmon-backup exports and imports volumes, stops and starts services, and
  # empties directories inside containers. Testing that needs a real daemon, and
  # the two obvious ways to get one are both bad: mounting the host socket gives
  # the test container root on the host, and running the suite on the host
  # breaks the rule that integration tests run in a container.
  #
  # This is the third way. The daemon is a sibling container, privileged but
  # ephemeral and empty: it sees none of the host's containers or volumes, so a
  # backup test cannot reach the live go-netmon deployment even if its project
  # resolution were wrong. Everything it creates dies with the stack.
  dind:
    image: docker:27-dind
    # Behind a profile, so it is started only when something asks for it.
    #
    # A privileged container is not available everywhere -- a CI runner that is
    # itself unprivileged or rootless cannot start one. That must degrade to
    # "this coverage was not obtained", announced, rather than failing the whole
    # suite: the other integration tests have nothing to do with Docker.
    # run-tests.sh tries to start it and passes DOCKER_HOST only if it comes up.
    profiles: ["dind"]
    privileged: true
    environment:
      # Plain TCP on an internal bridge network with no published ports. TLS
      # here would only protect the test container from itself.
      - DOCKER_TLS_CERTDIR=
    command: ["--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock"]
    volumes:
      # Its own storage, so overlay2 is not stacked on the test image's overlay.
      - dind-storage:/var/lib/docker
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  integration-test:
    build:
      context: .
      dockerfile: test/integration/Dockerfile.test
    depends_on:
      prometheus:
        condition: service_healthy
      snmp-simulator:
        condition: service_healthy
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - SNMP_HOST=snmp-simulator
      - SNMP_PORT=161
    networks:
      - test-network
    # run-tests.sh overrides this with the same package set. It is spelled here
    # too so that a bare "docker compose run integration-test" runs the whole
    # tagged suite rather than the one directory somebody happened to name --
    # the omission that left internal/mib/parser unrun (#30).
    command: ["bash", "-c", "go test -v -tags=integration $(test/integration/tagged-packages.sh)"]

networks:
  test-network:
    driver: bridge

volumes:
  prometheus-data:
  dind-storage:
