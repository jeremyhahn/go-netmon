version: '3.8'

services:
  # Prometheus for storing metrics
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: go-netmon-prometheus
    ports:
      - "9090:9090"  # Prometheus UI
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-remote-write-receiver'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'  # Keep data for 30 days
    networks:
      - netmon
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:10.0.0
    container_name: go-netmon-grafana
    ports:
      - "3000:3000"  # Grafana UI
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin  # Change this!
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - netmon
    restart: unless-stopped
    depends_on:
      - prometheus

  # go-netmon SNMP collector
  go-netmon:
    build:
      context: .
      dockerfile: Dockerfile
      # Modules vendored on the host; see scripts/docker-vendor.sh.
      additional_contexts:
        go-vendor: ./.docker-vendor
    container_name: go-netmon
    network_mode: host  # Use host network to access routers directly
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./mibs:/app/mibs
    restart: unless-stopped
    # Locked memory for the sealed SNMP credentials (go-enclave). A device's
    # credentials are open only for the length of its request, and one open
    # locks at most 24 KiB: three secrets, each a 4 KiB plaintext page and its
    # data key's page. 16 MiB, less the sealer's own 12 KiB of keys, holds
    # about 680 opens at once: a 256-device fleet polling at the same instant,
    # with better than 2x headroom. Past that, polls wait their turn instead of
    # failing. Docker's 64 KiB default holds two. See docs/deployment/user.md.
    ulimits:
      memlock:
        soft: 16777216
        hard: 16777216
    environment:
      - CONFIG_PATH=/app/config.yaml

networks:
  netmon:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
