# Prometheus self-monitoring scrape config; device metrics arrive by remote write. Not overwritten on re-deploy.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # Alerts on the metric catalog, which every dashboard panel depends on.
  # A glob matching nothing is not an error, so this is safe on a host that
  # has no rules directory yet.
  - "rules/*.yml"

scrape_configs:
  # The poller's internal metrics: poll counts, poll durations, SNMP errors.
  # metrics.listen_address in config.yaml.
  - job_name: 'go-netmon'
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels:
          service: 'go-netmon'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']
        labels:
          service: 'prometheus'
