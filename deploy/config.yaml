# go-netmon configuration — native appliance install.
#
# Installed to /etc/go-netmon/config.yaml by `make deploy`, and NOT overwritten
# on re-deploy: this file is operator data once the appliance is running.
# Use FORCE_CONFIG=1 to replace it deliberately.
#
# Devices are NOT listed here. They live in the web UI's store
# (/var/lib/go-netmon/webui/webui.db) and the poller pulls them from it at
# startup — which is why migrating a deployment means moving that store, not
# copying this file.
#
# The tunables below match the containerised deployment this appliance
# replaces. The paths deliberately do not: there is no /app on a host.

global:
  default_poll_interval: 30
  max_workers: 10
  snmp_timeout: 10
  snmp_retries: 3

prometheus:
  # Prometheus runs on this host, bound to loopback. It is the sole store for
  # every sample the poller produces; the poller keeps none itself and refuses
  # to start if this is empty.
  remote_write_url: "http://127.0.0.1:9090/api/v1/write"
  batch_size: 1000
  flush_interval: 10

  # This collector publishes the metric catalog: the series that tell a
  # dashboard what every metric means, so the UI renders from Prometheus alone
  # and needs no MIBs of its own.
  #
  # EXACTLY ONE collector in a fleet may have this on. The catalog carries no
  # device label, so every collector would write the same series at
  # uncoordinated moments, and a write landing behind one already ingested is
  # rejected out of order. That needs more than one collector to show up at
  # all, so it works in development and fails intermittently in production.
  #
  # Defaults to FALSE, so designation is always a decision somebody made: an
  # upgraded shard whose config predates this field must not silently become a
  # second emitter. Set explicitly here because this appliance runs one
  # collector.
  emit_metric_catalog: true

api:
  # Device registration and dashboard generation. Consumed by the web UI over
  # loopback.
  listen_address: ":9080"
  enabled: true

metrics:
  # The poller's OWN internal metrics (poll counts, durations), scraped by
  # Prometheus. Not the device metrics — those go out by remote write.
  listen_address: ":9100"
  enabled: true

mib:
  paths:
    # The MIB store this appliance owns. Modules land here when they are
    # imported and both services read it. Set for the poller by
    # MIB_UPLOADED_PATH in the unit file as well, so the two agree.
    - "/var/lib/go-netmon/poller/uploaded"
    # The IETF base set, so a fresh install with an empty store can still
    # parse the standard modules.
    - "/usr/local/share/go-netmon/mibs/standard"
    - "/usr/share/snmp/mibs"
  # The poller's MIB metadata store. Pebble admits a single writer, so this
  # belongs to the poller alone; the web UI keeps its own catalog and is
  # pointed at it with -mib-catalog in go-netmon-webui.service.
  storage_path: "/var/lib/go-netmon/poller/mib-storage"
  # A bootstrap list, not a limit. These are parsed at startup before any
  # device is known; every other module a device needs is parsed on demand.
  auto_load:
    - "SNMPv2-MIB"
    - "IF-MIB"
    - "CISCO-BGP4-MIB"

logging:
  # debug turns on per-OID and per-query tracing; info keeps it silent.
  level: "info"
  format: "json"
  # stdout is the right answer under systemd: the journal captures it, rotates
  # it, and `journalctl -u go-netmon` is where an operator will look.
  output: "stdout"

devices: []

# What the bell reports.
#
# Read by the web UI, which evaluates them against Prometheus and shows what is
# firing; the poller ignores them. `systemctl reload go-netmon-webui` re-reads
# this file without a restart, which matters here more than anywhere else in it:
# restarting the web UI costs minutes of MIB parsing, and tuning a threshold by
# restart is not something anyone would do twice.
#
# A rule is PromQL and fires once per series its expression returns, so a rule
# about interfaces fires once per interface. That is deliberate -- two ports
# being down is two things to fix -- but it is also the thing to think about
# when writing one: an expression that matches broadly will fill the bell.
alarms:
  # The monitoring system reporting on itself. These are the ones that are
  # silent on a healthy fleet and are never noise when they are not.
  - name: DeviceUnreachable
    expr: gonetmon_device_unreachable == 1
    severity: critical
    for: 2m
    summary: A device has stopped answering SNMP
    description: >-
      The poller has not had an answer from this device. Everything on its
      dashboard is the last thing it said, however recent the timestamps look:
      a chart carries its last reading forward at every tick.

  - name: MetricsNotReachingPrometheus
    expr: gonetmon_export_stalled == 1
    severity: critical
    summary: The collector cannot write to Prometheus
    description: >-
      Samples are being buffered and not delivered. The devices are being
      polled and nothing is being recorded, so this is invisible on a
      dashboard until the buffer is full and readings start disappearing.

  # AGGREGATE, do not evaluate per collector: gonetmon_catalog_series sits at
  # zero on every collector that is not the designated emitter, which is the
  # correct state for all but one of them.
  - name: MetricCatalogNotPublished
    expr: max(gonetmon_catalog_series) == 0
    severity: critical
    for: 10m
    summary: Nothing is publishing the metric catalog
    description: >-
      No collector in the fleet is publishing the catalog, so every dashboard
      loses its units, descriptions and decoded states once the existing series
      age out of the query window. The metrics themselves keep arriving and
      look perfectly healthy, which is what makes this hard to see.

  - name: BGPPeerNotEstablished
    expr: snmp_cbgpPeer2State != 6
    severity: critical
    for: 5m
    summary: A BGP peer is not established
    description: >-
      The session is in some state other than established. Five minutes is long
      enough to let an ordinary reconvergence pass without reporting it.

  - name: MetricNamesNotResolving
    expr: increase(gonetmon_metric_name_unresolved_samples_total[15m]) > 0
    severity: warning
    summary: Samples are arriving that no MIB can name
    description: >-
      The collector is publishing samples under raw-OID names because no loaded
      module describes the OID. They are charted, unlabeled. A jump here usually
      means a module stopped resolving rather than a device changing.

  # Fires once per interface, by design. Measured on this fleet: 36 interfaces
  # are labeled, administratively up and operationally down, nearly all of them
  # unused ports on access-02. That is an accurate reading rather than noise,
  # but it IS what a bell with three dozen entries looks like -- narrow the
  # expression to the devices or the interfaces you care about rather than
  # raising the threshold.
  #
  # The alias filter is the scoping already applied: an interface somebody
  # bothered to label is an interface somebody cares about.
  - name: InterfaceDown
    expr: >-
      snmp_ifOperStatus == 2
      and on(device,ifindex) snmp_ifAdminStatus == 1
      and on(device,ifindex) snmp_ifalias_info{value!=""}
    severity: warning
    for: 10m
    summary: A labeled interface is administratively up and operationally down
    description: >-
      The interface is configured to be up and is not. Ten minutes is long
      enough that a reload or a link flap has settled.
