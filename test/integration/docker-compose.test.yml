# SUPERSEDED -- do not use. The integration stack is defined by the repository
# root docker-compose.test.yml, which is what run-tests.sh, the test/integration
# Makefile and the root "make test-integration" target all bring up.
#
# This file is a second, divergent definition of the same stack and does not
# work:
#
#   * it sets SNMP_SIMULATOR_HOST/SNMP_SIMULATOR_PORT, but the tests read
#     SNMP_HOST/SNMP_PORT, so every test run against it would silently fall back
#     to localhost:1161 inside the test container and find no agent;
#   * it mounts no snmp-data/public.snmprec, so the simulator would serve none
#     of the objects the tests assert on;
#   * its integration-test service has no command, so it would not pass
#     -tags=integration and would compile the end-to-end test out of the binary.
#
# It is retained only because this change set may not delete files. It should be
# removed; nothing references it.

version: '3.8'

services:
  # Prometheus for storing test metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: test-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
      - '--storage.tsdb.retention.time=1h'
    ports:
      - "19090:9090"
    volumes:
      - prometheus-test-data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - test-network

  # SNMP simulator for testing
  snmp-simulator:
    image: tandrup/snmpsim
    container_name: test-snmp-simulator
    ports:
      - "11161:161/udp"
    networks:
      - test-network

  # Integration test container
  integration-test:
    build:
      context: ../..
      dockerfile: test/integration/Dockerfile.test
    container_name: integration-test
    # The tests run the poller and the web UI in-process, sealing and opening
    # SNMP credentials in locked memory; the same limit as docker-compose.yml.
    ulimits:
      memlock:
        soft: 16777216
        hard: 16777216
    depends_on:
      - prometheus
      - snmp-simulator
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - SNMP_SIMULATOR_HOST=snmp-simulator
      - SNMP_SIMULATOR_PORT=161
      - MIB_STORAGE_PATH=/tmp/go-netmon-test/mib-storage
    volumes:
      - ../..:/workspace
      - test-mib-storage:/tmp/go-netmon-test/mib-storage
    networks:
      - test-network
    working_dir: /workspace

volumes:
  prometheus-test-data:
  test-mib-storage:

networks:
  test-network:
    driver: bridge
