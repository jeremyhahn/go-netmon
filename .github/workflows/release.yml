# Release: verify the tag, rerun CI's gate on the tagged commit, build binaries and images, publish the GitHub release; see docs/operations/releasing.md.

name: Release

on:
  push:
    tags: ['v*']
  # Re-runs a release: the tag must already exist.
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release (e.g. v0.2.1)'
        type: string
        required: true
  # auto-release.yml calls this after tagging: a tag pushed with GITHUB_TOKEN starts no workflow.
  workflow_call:
    inputs:
      version:
        description: 'Tag to release (e.g. v0.2.1)'
        type: string
        required: true

# One run per tag, never cancelled: a half-published release is worse than a
# slow one. Keyed on the tag itself, so a call, a manual run and a tag push
# for the same version wait for one another.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

# Read-only unless a job asks for more below.
permissions:
  contents: read

env:
  GO_VERSION_FILE: go.mod

jobs:
  verify:
    name: Tag matches the tree
    runs-on: ubuntu-latest
    # The one place the release is resolved. Every later job builds and
    # publishes exactly this tag, version and commit.
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      epoch: ${{ steps.release.outputs.epoch }}
      date: ${{ steps.release.outputs.date }}
      latest: ${{ steps.release.outputs.latest }}
    # The tag: the input of a call or a manual run, else the pushed tag. It
    # reaches the shell only through the environment.
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      # The tag itself, whatever started the run. Full history: the check
      # needs origin/main to prove the tagged commit is on it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version || github.ref_name }}
          fetch-depth: 0

      # VERSION, CHANGELOG and changelog.d match the tag and the commit is on main; the tag reaches make only through the environment.
      - name: make release-verify
        run: make release-verify

      # latest decides GitHub's Latest release and the :X.Y/:latest tags: every release before 1.0, only plain vX.Y.Z after.
      - name: Record the release
        id: release
        run: |
          version="${TAG#v}"
          case "${version}" in
            0.*) latest=true ;;
            *-*) latest=false ;;
            *) latest=true ;;
          esac
          {
            echo "tag=${TAG}"
            echo "version=${version}"
            echo "sha=$(git rev-parse HEAD)"
            echo "epoch=$(git log -1 --format=%ct)"
            echo "date=$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
            echo "latest=${latest}"
          } >> "$GITHUB_OUTPUT"

  # The gate: every job ci.yml's "CI Passed" needs, same names and commands, on the tagged commit; scripts/tests/release-tests.sh checks it.
  lint:
    name: Format, Vet & Lint
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Provide golangci-lint
        env:
          GOLANGCI_LINT_MIN: "2.14.0"    # keep in step with the Makefile
        run: |
          set -eu
          gobin="$(go env GOPATH)/bin"
          export PATH="$gobin:$PATH"
          echo "$gobin" >> "$GITHUB_PATH"
          if command -v golangci-lint > /dev/null 2>&1; then
            echo "using the runner's golangci-lint: $(command -v golangci-lint)"
          else
            echo "golangci-lint absent; installing the pinned version"
            ok=0
            for i in 1 2 3; do
              if go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${GOLANGCI_LINT_MIN}"; then ok=1; break; fi
              echo "install attempt $i failed; retrying"; sleep 10
            done
            [ "$ok" = 1 ] || { echo "golangci-lint install failed after 3 attempts"; exit 1; }
          fi
          out=$(golangci-lint version 2>&1)
          echo "golangci-lint reports: $out"
          have=$(printf '%s\n' "$out" | sed -n 's/.* version v\{0,1\}\([0-9.]*\).*/\1/p')
          if [ "$have" != "$GOLANGCI_LINT_MIN" ]; then
            echo "golangci-lint is '${have}', but make lint accepts exactly ${GOLANGCI_LINT_MIN}"; exit 1
          fi

      - name: Provide actionlint
        env:
          ACTIONLINT_MIN: "1.7.12"
        run: |
          set -eu
          gobin="$(go env GOPATH)/bin"
          export PATH="$gobin:$PATH"
          if command -v actionlint > /dev/null 2>&1; then
            echo "using the runner's actionlint: $(command -v actionlint)"
          else
            echo "actionlint absent; installing the pinned version"
            ok=0
            for i in 1 2 3; do
              if go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_MIN}"; then ok=1; break; fi
              echo "install attempt $i failed; retrying"; sleep 10
            done
            [ "$ok" = 1 ] || { echo "actionlint install failed after 3 attempts"; exit 1; }
          fi
          out=$(actionlint -version 2>&1)
          echo "actionlint reports: $out"
          have=$(printf '%s\n' "$out" | sed -n '1s/^v\{0,1\}\([0-9.]*\).*/\1/p')
          lowest=$(printf '%s\n%s\n' "$ACTIONLINT_MIN" "$have" | sort -V | sed -n 1p)
          if [ -z "$have" ] || [ "$lowest" != "$ACTIONLINT_MIN" ]; then
            echo "actionlint is '${have}', below the floor ${ACTIONLINT_MIN}"; exit 1
          fi

      - run: make fmt-check
      - run: make vet

      - run: make vet-tags

      - run: make lint

      - name: Lint workflows
        run: actionlint

  security:
    name: Security Scan
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Provide govulncheck
        env:
          GOVULNCHECK_MIN: "1.8.0"
        run: |
          set -eu
          gobin="$(go env GOPATH)/bin"
          export PATH="$gobin:$PATH"
          echo "$gobin" >> "$GITHUB_PATH"
          if command -v govulncheck > /dev/null 2>&1; then
            echo "using the runner's govulncheck: $(command -v govulncheck)"
          else
            echo "govulncheck absent; installing the pinned version"
            ok=0
            for i in 1 2 3; do
              if go install "golang.org/x/vuln/cmd/govulncheck@v${GOVULNCHECK_MIN}"; then ok=1; break; fi
              echo "install attempt $i failed; retrying"; sleep 10
            done
            [ "$ok" = 1 ] || { echo "govulncheck install failed after 3 attempts"; exit 1; }
          fi
          out=$(govulncheck -version 2>&1)
          echo "govulncheck reports: $out"
          have=$(printf '%s\n' "$out" | sed -n 's/.*govulncheck@v\([0-9.]*\).*/\1/p')
          lowest=$(printf '%s\n%s\n' "$GOVULNCHECK_MIN" "$have" | sort -V | sed -n 1p)
          if [ -z "$have" ] || [ "$lowest" != "$GOVULNCHECK_MIN" ]; then
            echo "govulncheck is '${have}', below the floor ${GOVULNCHECK_MIN}"; exit 1
          fi

      - name: Provide trivy
        env:
          TRIVY_MIN: "0.75.0"
          TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
        run: |
          set -eu
          if command -v trivy > /dev/null 2>&1; then
            echo "using the runner's trivy: $(command -v trivy)"
          else
            echo "trivy absent; installing the pinned version"
            dir="$RUNNER_TEMP/trivy"
            mkdir -p "$dir"
            tarball="trivy_${TRIVY_MIN}_Linux-64bit.tar.gz"
            url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_MIN}/${tarball}"
            ok=0
            for i in 1 2 3; do
              if curl -fsSL -o "$dir/$tarball" "$url"; then ok=1; break; fi
              echo "download attempt $i failed; retrying"; sleep 10
            done
            [ "$ok" = 1 ] || { echo "trivy download failed after 3 attempts"; exit 1; }
            (cd "$dir" && echo "${TRIVY_SHA256}  ${tarball}" | sha256sum -c -)
            tar -xzf "$dir/$tarball" -C "$dir" trivy
            echo "$dir" >> "$GITHUB_PATH"
            export PATH="$dir:$PATH"
          fi
          out=$(trivy --version 2>&1)
          echo "trivy reports: $out"
          have=$(printf '%s\n' "$out" | sed -n 's/^Version: v\{0,1\}\([0-9.]*\).*/\1/p')
          lowest=$(printf '%s\n%s\n' "$TRIVY_MIN" "$have" | sort -V | sed -n 1p)
          if [ -z "$have" ] || [ "$lowest" != "$TRIVY_MIN" ]; then
            echo "trivy is '${have}', below the floor ${TRIVY_MIN}"; exit 1
          fi

      - run: make security

  test:
    name: Unit Tests
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Run unit tests
        run: make test

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -25

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: Build All Binaries
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - run: make build-all

  scripts:
    name: Shell Suites
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Shell test suites
        run: make test-scripts test-toolchain test-teardown test-integration-harness test-integration-guard test-e2e-guard test-release

      - name: Lint shell scripts
        run: make lint-scripts

  fips:
    name: FIPS
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOFIPS140: latest
      GODEBUG: fips140=only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - name: Build all packages (FIPS mode)
        run: go build -tags fips ./...
      - name: Unit tests (FIPS mode)
        run: go test -count=1 -timeout=900s -tags fips ./...

  integration:
    name: Integration Tests
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - run: make integration-test

  # The release archives. Pure Go, so both architectures cross-compile on one
  # runner. Nothing leaves the workflow from here: publish attaches the files
  # only after the gate passed.
  binaries:
    name: Release archives
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Build the archives, the SBOM and SHA256SUMS
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          make release-build VERSION="${VERSION}"
          make release-build-fips VERSION="${VERSION}"
          make release-sbom VERSION="${VERSION}"
          make release-checksums VERSION="${VERSION}"

      # The stamp is the version the tag names, in a binary from the archive
      # rather than from the build tree.
      - name: Check the archived CLI reports the release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/check"
          mkdir -p "$dir"
          tar -xzf "dist/go-netmon_${VERSION}_linux_amd64.tar.gz" -C "$dir"
          "$dir/go-netmon_${VERSION}_linux_amd64/netmon" version | tee "$dir/version.txt"
          grep -F "${VERSION}" "$dir/version.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: |
            dist/go-netmon_*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  # One runner per image, architecture and variant; each leg builds, scans, then pushes by digest only.
  image:
    name: Image (${{ matrix.repository }}, ${{ matrix.variant }}, ${{ matrix.arch }})
    needs: [verify, lint, security, test, build, scripts, fips, integration]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        repository: [go-netmon, go-netmon-webui]
        variant: [std, fips]
        arch: [amd64, arm64]
        include:
          - repository: go-netmon
            dockerfile: Dockerfile
          - repository: go-netmon-webui
            dockerfile: Dockerfile.webui
          - variant: std
            fips: '0'
          - variant: fips
            fips: '1'
          # trivy's release tarball for the runner, checked against the
          # sha256 from trivy_0.75.0_checksums.txt. Same pin as the security
          # job.
          - arch: amd64
            runner: ubuntu-latest
            trivy_tarball: trivy_0.75.0_Linux-64bit.tar.gz
            trivy_sha256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
          - arch: arm64
            runner: ubuntu-24.04-arm
            trivy_tarball: trivy_0.75.0_Linux-ARM64.tar.gz
            trivy_sha256: a1ee9f6ffb7d112b64ff726a2a0717c21175c1114361391f4a132956751a13b3
    env:
      # Image timestamps from the commit, so the scanned build and the pushed
      # build are the same image.
      SOURCE_DATE_EPOCH: ${{ needs.verify.outputs.epoch }}
      SCAN_REF: scan/${{ matrix.repository }}:${{ matrix.variant }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # moby/buildkit:buildx-stable-1
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Build the image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ needs.verify.outputs.sha }}
            BUILD_DATE=${{ needs.verify.outputs.date }}
            FIPS=${{ matrix.fips }}
          provenance: false
          load: true
          tags: ${{ env.SCAN_REF }}
          cache-from: type=gha,scope=${{ matrix.repository }}-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.repository }}-${{ matrix.variant }}-${{ matrix.arch }}

      - name: Provide trivy
        env:
          TRIVY_TARBALL: ${{ matrix.trivy_tarball }}
          TRIVY_SHA256: ${{ matrix.trivy_sha256 }}
        run: |
          set -eu
          dir="$RUNNER_TEMP/trivy"
          mkdir -p "$dir"
          url="https://github.com/aquasecurity/trivy/releases/download/v0.75.0/${TRIVY_TARBALL}"
          ok=0
          for i in 1 2 3; do
            if curl -fsSL -o "$dir/$TRIVY_TARBALL" "$url"; then ok=1; break; fi
            echo "download attempt $i failed; retrying"; sleep 10
          done
          [ "$ok" = 1 ] || { echo "trivy download failed after 3 attempts"; exit 1; }
          (cd "$dir" && echo "${TRIVY_SHA256}  ${TRIVY_TARBALL}" | sha256sum -c -)
          tar -xzf "$dir/$TRIVY_TARBALL" -C "$dir" trivy
          echo "$dir" >> "$GITHUB_PATH"

      - name: Scan the image
        run: make image-scan IMAGE="${SCAN_REF}"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same inputs as the scanned build, so every layer comes from its
      # cache: what is pushed is what was scanned.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ needs.verify.outputs.sha }}
            BUILD_DATE=${{ needs.verify.outputs.date }}
            FIPS=${{ matrix.fips }}
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.repository }}-${{ matrix.variant }}-${{ matrix.arch }}

      # Artifact file names cannot hold a colon, so the file is the digest
      # without its "sha256:" prefix; manifest puts it back.
      - name: Export the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.repository }}-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # One multi-arch manifest per image and variant. :X.Y.Z always; :X.Y and
  # :latest only when verify decided the release is latest. The FIPS variant
  # carries the same tags with a -fips suffix.
  manifest:
    name: Manifest (${{ matrix.repository }}, ${{ matrix.variant }})
    needs: [verify, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        repository: [go-netmon, go-netmon-webui]
        variant: [std, fips]
        include:
          - variant: std
            suffix: ''
          - variant: fips
            suffix: '-fips'
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.repository }}-${{ matrix.variant }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # moby/buildkit:buildx-stable-1
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch tags
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          LATEST: ${{ needs.verify.outputs.latest }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          # GHCR requires a lowercase repository path.
          IMAGE="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          tags=(-t "${IMAGE}:${VERSION}${SUFFIX}")
          if [ "${LATEST}" = true ]; then
            # X.Y from the core: 0.3.0-alpha moves :0.3, not :0.3.0-alpha's prefix.
            core="${VERSION%%-*}"
            tags+=(-t "${IMAGE}:${core%.*}${SUFFIX}" -t "${IMAGE}:latest${SUFFIX}")
          fi
          refs=()
          for digest in *; do
            refs+=("${IMAGE}@sha256:${digest}")
          done
          [ "${#refs[@]}" -eq 2 ] || { echo "expected an amd64 and an arm64 digest, found ${#refs[@]}"; exit 1; }
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}${SUFFIX}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.manifest.outputs.name }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  publish:
    name: Publish the release
    # Without status functions in its `if`, a job runs only when every job it
    # needs succeeded: a failed or skipped gate job publishes nothing.
    needs: [verify, lint, security, test, build, scripts, fips, integration, binaries, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Check every asset against SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          sha256sum -c SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/go-netmon_*.tar.gz

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/go-netmon_*.tar.gz
          sbom-path: dist/go-netmon_${{ needs.verify.outputs.version }}_sbom.cdx.json

      - name: Write the release notes
        env:
          REPO: ${{ github.repository }}
        run: |
          {
            make --no-print-directory release-notes
            cat <<EOF

          ## Install

          Archives for linux/amd64 and linux/arm64, and \`_fips\` archives built
          with the Go Cryptographic Module (GOFIPS140=latest):

          \`\`\`bash
          curl -LO https://github.com/${REPO}/releases/download/${TAG}/go-netmon_${VERSION}_linux_amd64.tar.gz
          curl -LO https://github.com/${REPO}/releases/download/${TAG}/SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          gh attestation verify go-netmon_${VERSION}_linux_amd64.tar.gz --repo ${REPO}
          \`\`\`

          Images for linux/amd64 and linux/arm64:

          \`\`\`bash
          docker pull ghcr.io/${REPO}:${VERSION}
          docker pull ghcr.io/${REPO}-webui:${VERSION}
          \`\`\`

          Append \`-fips\` to a tag for the FIPS build (\`${VERSION}-fips\`).
          See docs/deployment/user.md.
          EOF
          } > "$RUNNER_TEMP/NOTES.md"
          cat "$RUNNER_TEMP/NOTES.md"

      # The tag is re-read from the remote: a tag moved after verify ran must
      # not publish the old commit's assets under the new commit's name.
      - name: Confirm the tag still names the verified commit
        env:
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          git fetch --quiet --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          now="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          [ "$now" = "$SHA" ] || { echo "::error::${TAG} now names ${now}, not the verified ${SHA}"; exit 1; }

      - name: Create the draft release
        id: draft
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: go-netmon ${{ needs.verify.outputs.tag }}
          body_path: ${{ runner.temp }}/NOTES.md
          draft: true
          # legacy lets GitHub pick Latest by date and SemVer, so re-running an older release never takes Latest.
          prerelease: ${{ needs.verify.outputs.latest != 'true' }}
          make_latest: ${{ needs.verify.outputs.latest == 'true' && 'legacy' || 'false' }}
          files: |
            dist/go-netmon_*
            dist/SHA256SUMS
          fail_on_unmatched_files: true

      # Published only when the draft holds every file in dist/; GitHub never makes a draft Latest.
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          MAKE_LATEST: ${{ needs.verify.outputs.latest == 'true' && 'legacy' || 'false' }}
        run: |
          set -euo pipefail
          want="$(find dist -maxdepth 1 -type f | wc -l)"
          have="$(gh api "repos/${REPO}/releases/${RELEASE_ID}" --jq '.assets | length')"
          [ "$have" -eq "$want" ] || { echo "::error::the draft holds ${have} of ${want} assets; not publishing"; exit 1; }
          gh api --method PATCH "repos/${REPO}/releases/${RELEASE_ID}" -F draft=false -f make_latest="${MAKE_LATEST}" --jq '.html_url'
