# Tags and publishes a release when a green push to main carries a new, untagged VERSION; docs/operations/releasing.md.

name: Auto Release

on:
  workflow_run:
    # ci.yml's `name:`.
    workflows: [CI]
    types: [completed]

# One release decision at a time, so two green merges cannot both tag one VERSION.
concurrency:
  group: auto-release
  cancel-in-progress: false

# Read-only unless a job asks for more below.
permissions:
  contents: read

jobs:
  resolve:
    name: Resolve the release
    # Only a green CI run for a push to main. Pull request runs, manual runs,
    # failed runs and other branches never release.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    # To push the tag.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      # Full history: every tag for the version ordering check, the parent
      # commit it runs against, and origin/main for release-verify.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve the version
        id: resolve
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="v$(tr -d '[:space:]' < VERSION)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "${tag} is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Release only main's tip; a later green commit with the same VERSION is the one released.
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse refs/remotes/origin/main)" != "${HEAD_SHA}" ]; then
            echo "${HEAD_SHA} is no longer main's tip; the newer commit decides."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      # Run release.yml's verify checks before tagging, so a tag never names a release that cannot ship.
      - name: make release-verify
        if: steps.resolve.outputs.release == 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: make release-verify

      # The version check runs against the parent commit, where VERSION still holds the previous release.
      - name: Check the version moves forward
        if: steps.resolve.outputs.release == 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          git worktree add --quiet --detach "${RUNNER_TEMP}/previous" HEAD^
          cd "${RUNNER_TEMP}/previous"
          ./scripts/release-version-check.sh "${TAG}"

      - name: Tag the release
        if: steps.resolve.outputs.release == 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "go-netmon ${TAG}" "${HEAD_SHA}"
          git push origin "refs/tags/${TAG}"

  release:
    name: Release
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    # Exactly what release.yml's jobs ask for: packages to push the images,
    # id-token and attestations to attest them and the archives, contents to
    # create the GitHub release.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.resolve.outputs.tag }}
