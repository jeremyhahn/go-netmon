# claude-review: v1.0 — Claude peer review on demand (conventions/sdlc.md §8).
# DISABLED, see the note above `on:` below. It used to run when a PR carried
# `review:claude` (Claude instead of Codex) or `review:dual` (both reviewers
# must APPROVE the current head before merge — the merging agent enforces the
# dual requirement). Every PR now takes the Codex-only pipeline
# (codex-review.yml), which is unchanged.
#
# `runs-on: claude` is restricted: only this workflow and task-worker.yml
# may use it — the label mounts the live Claude session credential.
# Gitea-only. Source of truth: software/templates/github-actions/ in the
# company repo.
name: Claude Review

# DISABLED 2026-08-24 (owner ruling): Codex is the sole designated peer
# reviewer. The review:claude and review:dual labels were deleted from every
# repo the same day, so the pull_request trigger was removed: the workflow now
# runs only when a human dispatches it by hand. Disabling at the trigger rather
# than with a job-level `if: false` is deliberate — actionlint rejects a
# constant condition ([if-cond]), which reddened main. To re-enable, restore:
#   pull_request:
#     types: [opened, synchronize, reopened, labeled]
on:
  # Disabled 2026-09-06 (owner ruling): gpu-host is the only review host and
  # the `claude` lane is stopped, so a pull_request trigger would queue a job
  # with no runner. Manual dispatch only.
  workflow_dispatch:

jobs:
  review:
    name: Claude Review
    runs-on: claude
    timeout-minutes: 40
    env:
      REPO: ${{ github.event.repository.name }}
      PR_NUM: ${{ github.event.pull_request.number }}
      FORGE_REVIEW_C_TOKEN: ${{ secrets.REVIEW_BOT_C_TOKEN }}
    steps:
      - name: Run Claude review
        run: /opt/claude-worker/claude-review.sh
