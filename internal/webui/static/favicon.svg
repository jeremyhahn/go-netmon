<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad)"/>

  <!-- Network topology icon -->
  <!-- Center node -->
  <circle cx="50" cy="50" r="8" fill="white"/>

  <!-- Top node -->
  <circle cx="50" cy="20" r="6" fill="white"/>
  <line x1="50" y1="28" x2="50" y2="42" stroke="white" stroke-width="2"/>

  <!-- Bottom node -->
  <circle cx="50" cy="80" r="6" fill="white"/>
  <line x1="50" y1="58" x2="50" y2="72" stroke="white" stroke-width="2"/>

  <!-- Left node -->
  <circle cx="20" cy="50" r="6" fill="white"/>
  <line x1="28" y1="50" x2="42" y2="50" stroke="white" stroke-width="2"/>

  <!-- Right node -->
  <circle cx="80" cy="50" r="6" fill="white"/>
  <line x1="58" y1="50" x2="72" y2="50" stroke="white" stroke-width="2"/>
</svg>
