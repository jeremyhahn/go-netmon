# golangci-lint configuration (schema v2).
version: "2"

run:
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - revive
    - gosec
    - gocritic
    - misspell
    - unconvert
    - prealloc
    - bodyclose
    - noctx
    - unparam
    - whitespace
    - gocyclo
    - dupl

  settings:
    errcheck:
      exclude-functions:
        # Writing rendered output is the last step; a broken stream has nowhere left to report.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println

    govet:
      enable-all: true
      disable:
        # Reports every unkeyed nested struct literal in test fixtures; the
        # signal-to-noise ratio does not justify it here.
        - fieldalignment

    revive:
      confidence: 0.8
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G404 # weak RNG: nothing here is security-sensitive

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - whyNoLint
        - unnamedResult
        # API and dashboard record types are passed by value on purpose; pkg/client signatures are public SDK.
        - hugeParam
        - rangeValCopy

    gocyclo:
      min-complexity: 15

    dupl:
      threshold: 100

    misspell:
      locale: US

    unparam:
      check-exported: false

  exclusions:
    rules:
      # Dashboard JSON and MIB trees are read by other UIDs and hold no secrets, so 0755/0644 is intended.
      - path: (internal/grafana/template/|internal/mib/importer/downloader\.go|internal/webui/api/mib_import\.go)
        linters:
          - gosec
        text: "G30[16]"

      # Test files trade some of these off deliberately: table tests repeat
      # structure, fixtures ignore errors that cannot fail, and a long test
      # body is usually clearer than a decomposed one.
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - gocritic
          - unparam
          # Test handlers and interface stubs keep their parameter names for readability.
          - revive
          # noctx: requests here go to an httptest.Server whose lifetime is the
          # test's own, so there is no cancellation for a context to carry.
          - noctx

      # CLI command constructors and web UI record CRUD duplicate by design until a shared factory or record store exists.
      - path: (internal/cli/(device|profile|mib)\.go|internal/webui/storage/(device|mib|profile)\.go)
        linters:
          - dupl

      # gocyclo ratchet: functions not listed here are held to 15.
      - linters:
          - gocyclo
        text: "func `(run|dashboardGenerateAll|setDefaults|\\(\\*Config\\)\\.Validate|\\(\\*Builder\\)\\.Generate|\\(\\*PanelGenerator\\)\\.GenerateTablePanels|\\(\\*PanelGenerator\\)\\.determineUnit|\\(\\*Engine\\)\\.Validate|SanitizeMetricName|\\(\\*TableIndexCache\\)\\.CacheFriendlyNames|parseIndexValue|ConvertStatusColumnsToInfoMetrics|ConvertSNMPResultsWithTableIndexes|parseOctetHint|FormatValue|\\(\\*Loader\\)\\.LoadModule|\\(\\*Parser\\)\\.parseNode|\\(\\*Parser\\)\\.determineChartability|\\(\\*worker\\)\\.poll|\\(\\*Result\\)\\.TypeString|\\(\\*Result\\)\\.GetUint64Value|\\(\\*Server\\)\\.generateDashboard|\\(\\*Server\\)\\.handleMetricsQuery|convertToTimeSeries|\\(\\*Server\\)\\.handleImportMIB|\\(\\*Server\\)\\.handleQueryMetrics|\\(\\*Server\\)\\.performSNMPTest|GenerateDashboardWithLearnedTables|buildTableWidgetWithLearnedData|buildInstanceSelectorFromMultiple|findFriendlyNameLabel|\\(\\*Storage\\)\\.GetDeviceMIBs|\\(\\*Storage\\)\\.GetDeviceMIBsSeparated)` is high"

      # Storage and API helpers take a context by contract even where they do not use it yet.
      - path: internal/webui/(storage|api)/
        linters:
          - revive
        text: "unused-parameter: parameter 'ctx'"
      - path: internal/webui/(storage|api)/
        linters:
          - unparam
        text: "ctx is unused"

      # govet's unusedwrite on fixtures: table tests populate a struct fully to
      # document the shape under test even when one case only reads some of it.
      - path: _test\.go
        linters:
          - govet
        text: "unusedwrite"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/jeremyhahn/go-netmon

issues:
  # The tree is clean, so caps would only hide the size of a regression.
  max-issues-per-linter: 0
  max-same-issues: 0
